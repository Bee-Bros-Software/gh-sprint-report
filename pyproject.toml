[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-sprint-report"
version = "1.0.2"
description = "Sprint reports, review decks, and follow-up workbooks from a GitHub Projects board."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["github", "projects", "agile", "sprint", "scrum", "reporting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
]

dependencies = [
    "openpyxl>=3.1",
    "requests>=2.31",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "interrogate>=1.7",
    "pydocstyle>=6.3",
    "ruff>=0.5",
    "mypy>=1.10",
]
docs = [
    "sphinx>=7.3",
    "sphinx-rtd-theme>=2.0",
]

[project.scripts]
sprint-report = "sprint_report.cli:main"

[project.urls]
Homepage = "https://github.com/Bee-Bros-Software/gh-sprint-report"
Issues = "https://github.com/Bee-Bros-Software/gh-sprint-report/issues"
Changelog = "https://github.com/Bee-Bros-Software/gh-sprint-report/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["sprint_report"]

[tool.interrogate]
fail-under = 95
ignore-init-module = false
ignore-magic = true
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = true
exclude = ["docs", "build", ".venv"]
verbose = 1

[tool.pydocstyle]
convention = "google"
match = "(?!test_).*\\.py"
add-ignore = "D107"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "B"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
